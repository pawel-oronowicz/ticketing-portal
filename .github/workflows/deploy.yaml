name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress

      - name: Create .env file
        working-directory: ./api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create required storage directories
        working-directory: ./api
        run: |
          mkdir -p storage/framework/{sessions,views,cache,testing}
          mkdir -p storage/logs
          mkdir -p bootstrap/cache
          mkdir -p tests/.pest/snapshots

      - name: Run tests
        working-directory: ./api
        run: vendor/bin/pest --fail-on-warning --fail-on-risky

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::896586841943:role/GitHubActions
          aws-region: eu-north-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/ticketing-portal-api:latest -f docker/php/Dockerfile .
          docker push ${{ steps.ecr-login.outputs.registry }}/ticketing-portal-api:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}
            docker pull ${{ steps.ecr-login.outputs.registry }}/ticketing-portal-api:latest
            docker stop php
            docker rm php
            docker run -d --name php --network ticketing-network \
              -e APP_ENV=production \
              -e DB_CONNECTION=pgsql \
              -e DB_HOST=ticketingportal-test.c3owge8yes6v.eu-north-1.rds.amazonaws.com \
              -e DB_PORT=5432 \
              -e DB_DATABASE=ticketing \
              -e DB_USERNAME=postgres \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e APP_KEY=${{ secrets.APP_KEY }} \
              -e REGISTRATION_ENABLED=false \
              -e DEMO_MODE=true \
              ${{ steps.ecr-login.outputs.registry }}/ticketing-portal-api:latest
            docker restart nginx

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://api.paweloronowicz.com/api
        run: |
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::896586841943:role/GitHubActions
          aws-region: eu-north-1

      - name: Sync to S3
        run: aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ticketing-portal/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"