name: Deploy

on:
  push:
    branches: [master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql

      - name: Install Composer dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        working-directory: ./api
        run: vendor/bin/pest